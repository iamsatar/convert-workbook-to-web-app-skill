<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Workbook-derived web application" />
    <title>Workbook App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#17211b",
              canvas: "#f6f7f3",
              accent: "#256d4b",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-canvas text-ink antialiased">
    <header class="border-b border-black/10 bg-white">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
        <div>
          <p class="text-xs font-medium uppercase tracking-[0.16em] text-black/50">Workbook app</p>
          <h1 id="app-title" class="text-lg font-semibold">MVP workspace</h1>
        </div>
        <p id="save-status" class="text-sm text-black/55" aria-live="polite">Ready</p>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-5 py-8">
      <section aria-labelledby="page-heading" class="rounded-xl border border-black/10 bg-white p-6 shadow-sm">
        <div class="max-w-2xl">
          <p class="text-sm font-medium text-accent">Starter screen</p>
          <h2 id="page-heading" class="mt-1 text-2xl font-semibold tracking-tight">Replace this with the approved workflow</h2>
          <p class="mt-2 text-sm leading-6 text-black/60">
            Model the workbook as task-focused pages, named calculations, and clear validation—not as copied worksheet tabs.
          </p>
        </div>

        <form id="starter-form" class="mt-7 max-w-xl space-y-5">
          <label class="block">
            <span class="text-sm font-medium">Example input</span>
            <input
              id="example-input"
              name="exampleInput"
              type="number"
              inputmode="decimal"
              class="mt-2 w-full rounded-lg border border-black/15 px-3 py-2.5 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/15"
              placeholder="0"
            />
          </label>
          <button type="submit" class="rounded-lg bg-accent px-4 py-2.5 text-sm font-medium text-white hover:bg-accent/90 focus:outline-none focus:ring-2 focus:ring-accent/30">
            Save example
          </button>
        </form>

        <dl class="mt-8 grid gap-4 border-t border-black/10 pt-6 sm:grid-cols-2">
          <div>
            <dt class="text-sm text-black/55">Example result</dt>
            <dd id="example-result" class="mt-1 text-2xl font-semibold">0</dd>
          </div>
          <div>
            <dt class="text-sm text-black/55">Storage</dt>
            <dd class="mt-1 text-sm font-medium">This browser only</dd>
          </div>
        </dl>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
